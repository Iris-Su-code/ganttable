    function DashboardView({ selectedProject, setView, setSelectedProject }) {
      const today = TODAY;
      const todayD = parseDate(today);
      const in7 = fmtDate(new Date(todayD.getTime() + 7*864e5));
      const weekAgo = fmtDate(new Date(todayD.getTime() - 7*864e5));
      const PC=["#7c3aed","#a0785a","#ec4899","#3b82f6","#10b981","#f97316","#06b6d4","#ef4444"];
      const MC=["#3b82f6","#10b981","#f59e0b","#ef4444"];
      const [editingReviewId, setEditingReviewId] = useState(null);
      const [editingReviewText, setEditingReviewText] = useState("");
      const [expandedCustomer, setExpandedCustomer] = useState(null); // projectId of expanded customer info
      const [editingCustomer, setEditingCustomer] = useState(null); // projectId being edited
      const [customerForm, setCustomerForm] = useState({name:"", contact:"", phone:"", email:"", notes:""});

      // 1. Project overview data
      const projectCards = PROJECTS.map(p => {
        const tasks = TASKS.filter(t => t.projectId === p.id);
        const done = tasks.filter(t => t.done).length;
        const total = tasks.length;
        const prog = total ? Math.round(done/total*100) : 0;
        const phases = PHASES.filter(ph => ph.projectId === p.id).sort((a,b) => a.order - b.order);
        const currentPhase = phases.find(ph => { const pt = tasks.filter(t => t.phaseId === ph.id); return pt.length > 0 && !pt.every(t => t.done); });
        const hasOverdue = tasks.some(t => !t.done && t.end < today);
        const status = total === 0 ? "empty" : done === total ? "done" : hasOverdue ? "overdue" : "normal";
        const hrs = totalHours(tasks);
        const cost = totalCost(tasks);
        return { ...p, tasks, done, total, prog, currentPhase, status, hrs, cost };
      }).sort((a,b) => a.prog - b.prog);

      // 2. Overdue + upcoming tasks (all projects)
      const overdueTasks = TASKS.filter(t => !t.done && t.end < today).sort((a,b) => a.end.localeCompare(b.end));
      const upcomingTasks = TASKS.filter(t => !t.done && t.end >= today && t.end <= in7).sort((a,b) => a.end.localeCompare(b.end));

      // 3. Recently completed (end date within last 7 days and done)
      const recentDone = TASKS.filter(t => t.done && t.end >= weekAgo && t.end <= today).sort((a,b) => b.end.localeCompare(a.end));

      // 4. Member workload
      const allMembers = new Set(TASKS.flatMap(t => t.members));
      const memberData = [...allMembers].map(m => {
        const tasks = TASKS.filter(t => t.members.includes(m));
        const done = tasks.filter(t => t.done).length;
        return { name: m, total: tasks.length, done, hrs: totalHours(tasks) };
      }).sort((a,b) => b.total - a.total);

      // 5. Phase progress for selected project
      const selPhases = PHASES.filter(ph => ph.projectId === selectedProject).sort((a,b) => a.order - b.order);
      const selProj = PROJECTS.find(p => p.id === selectedProject);

      // 6. Cost/hours totals
      const allTasks = TASKS;
      const totalHrs = totalHours(allTasks);
      const totalCostAll = totalCost(allTasks);
      const projectCostData = PROJECTS.map(p => {
        const tasks = TASKS.filter(t => t.projectId === p.id);
        return { name: p.name.slice(0,10), color: p.color, cost: totalCost(tasks), hrs: totalHours(tasks) };
      }).filter(d => d.cost > 0 || d.hrs > 0);
      const memberCostData = memberData.filter(d => d.hrs > 0).map(d => ({name:d.name, value:d.hrs}));

      // Task status distribution data
      const doneCount = TASKS.filter(t => t.done).length;
      const overdueCount = overdueTasks.length;
      const upcomingCount = upcomingTasks.length;
      const pendingCount = TASKS.filter(t => !t.done && t.end > in7).length;
      const statusData = [
        { name: "\u5DF2\u5B8C\u6210", value: doneCount, color: "#10b981" },
        { name: "\u8FDB\u884C\u4E2D", value: upcomingCount, color: "#f59e0b" },
        { name: "\u8D85\u671F", value: overdueCount, color: "#ef4444" },
        { name: "\u672A\u5F00\u59CB", value: pendingCount, color: "#9ca3af" }
      ].filter(d => d.value > 0);

      // Weekly completion trend (last 8 weeks)
      const weeklyData = useMemo(() => {
        const weeks = [];
        for (let i = 7; i >= 0; i--) {
          const weekStart = new Date(todayD.getTime() - i * 7 * 864e5);
          const weekEnd = new Date(weekStart.getTime() + 6 * 864e5);
          const count = TASKS.filter(t => {
            if (!t.done) return false;
            const endD = parseDate(t.end);
            return endD >= weekStart && endD <= weekEnd;
          }).length;
          weeks.push({
            week: `${weekStart.getMonth()+1}/${weekStart.getDate()}`,
            count
          });
        }
        return weeks;
      }, [TASKS, todayD]);

      const goToTask = (task) => { setSelectedProject(task.projectId); setView("gantt"); };
      const reviewRef = useRef(null);
      const scrollToReview = () => { if(reviewRef.current) reviewRef.current.scrollIntoView({behavior:"smooth", block:"start"}); };

      return h("div", {className:"dashboard-container", style:{overflowY:"auto", flex:1}},
        // ─ Nav ──
        h("div", {style:{display:"flex", justifyContent:"flex-end", marginBottom:12}},
          h("button", {style:{padding:"4px 14px", borderRadius:6, border:"1px solid #e5e7eb", background:"#fff", fontSize:12, cursor:"pointer", color:"#4f46e5"}, onClick:scrollToReview}, "\u2193 \u590D\u76D8\u7ED3\u679C")
        ),

        // ── Row 1: Project Overview (full width, auto-wrap) ──
        h("div", {style:{marginBottom:16}},
          h("div", {style:{fontSize:15, fontWeight:700, color:"#1f2937", marginBottom:12}}, "\u9879\u76EE\u8FDB\u5EA6\u603B\u89C8"),
          h("div", {style:{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))", gap:10}},
            ...projectCards.map(pc => {
              const isExpanded = expandedCustomer === pc.id;
              const isEditing = editingCustomer === pc.id;
              const cust = pc.customer || {name:"", contact:"", phone:"", email:"", notes:""};
              const hasCustomer = cust.name || cust.contact || cust.phone || cust.email;
              return h("div", {key:pc.id, className:"dash-proj-card", style:{cursor:"pointer"}},
                // Project header (clickable to navigate)
                h("div", {style:{cursor:"pointer"}, onClick:()=>{setSelectedProject(pc.id); setView("gantt");}},
                  h("div", {style:{display:"flex", alignItems:"center", gap:8, marginBottom:10}},
                    h("span", {style:{width:10, height:10, borderRadius:"50%", background:pc.color, flexShrink:0}}),
                    h("span", {style:{fontSize:14, fontWeight:600, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}, pc.name),
                    pc.status === "done" && h("span", {style:{fontSize:10, background:"#d1fae5", color:"#065f46", padding:"2px 6px", borderRadius:8, fontWeight:600}}, "\u5DF2\u5B8C\u6210"),
                    pc.status === "overdue" && h("span", {style:{fontSize:10, background:"#fee2e2", color:"#991b1b", padding:"2px 6px", borderRadius:8, fontWeight:600}}, "\u8D85\u671F"),
                    pc.status === "normal" && h("span", {style:{fontSize:10, background:"#dbeafe", color:"#1e40af", padding:"2px 6px", borderRadius:8, fontWeight:600}}, "\u8FDB\u884C\u4E2D")
                  ),
                  h("div", {style:{display:"flex", alignItems:"center", gap:8, marginBottom:8}},
                    h("div", {className:"progress-bar", style:{flex:1, height:8}},
                      h("div", {className:"progress-bar-fill", style:{width:`${pc.prog}%`, background: pc.status==="done" ? "#10b981" : pc.color}})
                    ),
                    h("span", {style:{fontSize:13, fontWeight:700, color:"#374151", minWidth:38, textAlign:"right"}}, `${pc.prog}%`)
                  ),
                  h("div", {style:{fontSize:12, color:"#6b7280", display:"flex", justifyContent:"space-between"}},
                    h("span", null, `${pc.done}/${pc.total} \u4EFB\u52A1`),
                    pc.currentPhase ? h("span", {style:{color:pc.currentPhase.color}}, pc.currentPhase.name) : h("span", null, "\u2014")
                  )
                ),
                // Customer info toggle
                hasCustomer && h("div", {style:{marginTop:8, paddingTop:8, borderTop:"1px solid #f0f0f0"}},
                  h("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer"}, onClick:(e)=>{e.stopPropagation(); setExpandedCustomer(isExpanded ? null : pc.id);}},
                    h("span", {style:{fontSize:11, color:"#6b7280"}}, "\u{1F464} " + (cust.name || "\u5BA2\u6237\u4FE1\u606F")),
                    h("span", {style:{fontSize:10, color:"#9ca3af"}}, isExpanded ? "\u25B2" : "\u25BC")
                  ),
                  isExpanded && h("div", {style:{marginTop:6, fontSize:11, color:"#6b7280", lineHeight:1.6}, onClick:(e)=>e.stopPropagation()},
                    cust.contact && h("div", null, "\u8054\u7CFB\u4EBA: " + cust.contact),
                    cust.phone && h("div", null, "\u7535\u8BDD: " + cust.phone),
                    cust.email && h("div", null, "\u90AE\u7BB1: " + cust.email),
                    cust.notes && h("div", {style:{marginTop:4, color:"#9ca3af"}}, cust.notes)
                  )
                ),
                // Edit customer button
                h("div", {style:{marginTop:6, textAlign:"right"}, onClick:(e)=>e.stopPropagation()},
                  h("button", {
                    style:{padding:"2px 8px", borderRadius:4, border:"1px solid #e5e7eb", background:"#fff", fontSize:10, cursor:"pointer", color:"#6b7280"},
                    onClick: () => {
                      if(isEditing) {
                        // Save
                        const proj = PROJECTS.find(p => p.id === pc.id);
                        if(proj) { proj.customer = {...customerForm}; }
                        setEditingCustomer(null);
                        autoSave();
                      } else {
                        // Start editing
                        setEditingCustomer(pc.id);
                        setCustomerForm(cust);
                      }
                    }
                  }, isEditing ? "\u4FDD\u5B58" : "\u7F16\u8F91\u5BA2\u6237")
                ),
                // Customer edit form
                isEditing && h("div", {style:{marginTop:8, padding:8, background:"#f9fafb", borderRadius:6}, onClick:(e)=>e.stopPropagation()},
                  h("input", {style:{width:"100%", padding:"4px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:11, marginBottom:6, outline:"none"}, value:customerForm.name, onChange:e=>setCustomerForm({...customerForm, name:e.target.value}), placeholder:"\u5BA2\u6237\u540D\u79F0"}),
                  h("input", {style:{width:"100%", padding:"4px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:11, marginBottom:6, outline:"none"}, value:customerForm.contact, onChange:e=>setCustomerForm({...customerForm, contact:e.target.value}), placeholder:"\u8054\u7CFB\u4EBA"}),
                  h("input", {style:{width:"100%", padding:"4px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:11, marginBottom:6, outline:"none"}, value:customerForm.phone, onChange:e=>setCustomerForm({...customerForm, phone:e.target.value}), placeholder:"\u7535\u8BDD"}),
                  h("input", {style:{width:"100%", padding:"4px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:11, marginBottom:6, outline:"none"}, value:customerForm.email, onChange:e=>setCustomerForm({...customerForm, email:e.target.value}), placeholder:"\u90AE\u7BB1"}),
                  h("textarea", {style:{width:"100%", padding:"4px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:11, outline:"none", resize:"vertical"}, rows:2, value:customerForm.notes, onChange:e=>setCustomerForm({...customerForm, notes:e.target.value}), placeholder:"\u5907\u6CE8"})
                )
              );
            })
          )
        ),

        // ── Row 2: Charts (Status Distribution + Weekly Trend) ──
        h("div", {style:{display:"flex", gap:16, marginBottom:16}},
          // Task Status Distribution (Donut Chart)
          h("div", {className:"dashboard-section", style:{flex:"0 0 320px", marginBottom:0}},
            h("div", {className:"dashboard-section-title"}, "\u4EFB\u52A1\u72B6\u6001\u5206\u5E03"),
            statusData.length === 0
              ? h("div", {style:{padding:20, color:"#9ca3af", fontSize:12, textAlign:"center"}}, "\u6682\u65E0\u6570\u636E")
              : h("div", null,
                  h(ResponsiveContainer, {width:"100%", height:180},
                    h(PieChart, null,
                      h(Pie, {
                        data: statusData,
                        cx: "50%",
                        cy: "50%",
                        innerRadius: 45,
                        outerRadius: 70,
                        paddingAngle: 2,
                        dataKey: "value"
                      },
                        ...statusData.map((entry, i) => h(Cell, {key: i, fill: entry.color}))
                      ),
                      h(RTooltip, null)
                    )
                  ),
                  h("div", {style:{display:"flex", flexWrap:"wrap", gap:"8px 16px", justifyContent:"center", marginTop:8}},
                    ...statusData.map((d, i) =>
                      h("div", {key:i, style:{display:"flex", alignItems:"center", gap:4, fontSize:11}},
                        h("span", {style:{width:8, height:8, borderRadius:"50%", background:d.color, flexShrink:0}}),
                        h("span", {style:{color:"#6b7280"}}, `${d.name} ${d.value}`)
                      )
                    )
                  )
                )
          ),
          // Weekly Completion Trend (Line Chart)
          h("div", {className:"dashboard-section", style:{flex:1, minWidth:0, marginBottom:0}},
            h("div", {className:"dashboard-section-title"}, "\u8FD18\u5468\u5B8C\u6210\u8D8B\u52BF"),
            h(ResponsiveContainer, {width:"100%", height:200},
              h(LineChart, {data: weeklyData},
                h(CartesianGrid, {strokeDasharray:"3 3", stroke:"#e5e7eb"}),
                h(XAxis, {dataKey:"week", tick:{fontSize:11}, stroke:"#9ca3af"}),
                h(YAxis, {allowDecimals:false, tick:{fontSize:11}, stroke:"#9ca3af"}),
                h(RTooltip, null),
                h(Line, {type:"monotone", dataKey:"count", stroke:"#4f46e5", strokeWidth:2, dot:{r:4, fill:"#4f46e5"}, activeDot:{r:6}})
              )
            )
          )
        ),

        // ── Row 3: Alerts (3 columns) ──
        h("div", {style:{display:"flex", gap:16, marginBottom:16}},
          // Overdue tasks
          h("div", {className:"dashboard-section", style:{flex:1, minWidth:0, marginBottom:0}},
            h("div", {className:"dashboard-section-title"},
              h("span", {style:{color:"#ef4444"}}, "\u26A0 \u8D85\u671F\u4EFB\u52A1"),
              h("span", {style:{fontSize:12, fontWeight:400, color:"#9ca3af"}}, ` ${overdueTasks.length}`)
            ),
            overdueTasks.length === 0
              ? h("div", {style:{padding:12, color:"#9ca3af", fontSize:12, textAlign:"center"}}, "\u65E0\u8D85\u671F\u4EFB\u52A1")
              : overdueTasks.slice(0,8).map((t,i) => {
                  const proj = PROJECTS.find(p=>p.id===t.projectId);
                  const daysOver = Math.round((todayD - parseDate(t.end)) / 864e5);
                  return h("div", {key:t.id, className:"dash-alert-item", onClick:()=>goToTask(t)},
                    h("span", {style:{width:8, height:8, borderRadius:"50%", background:proj?proj.color:"#999", flexShrink:0}}),
                    h("span", {style:{flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}, t.name),
                    h("span", {style:{color:"#ef4444", fontWeight:600, whiteSpace:"nowrap", fontSize:11}}, `${daysOver}\u5929`)
                  );
                })
          ),
          // Upcoming tasks
          h("div", {className:"dashboard-section", style:{flex:1, minWidth:0, marginBottom:0}},
            h("div", {className:"dashboard-section-title"},
              h("span", {style:{color:"#f59e0b"}}, "\u23F0 7\u5929\u5185\u5230\u671F"),
              h("span", {style:{fontSize:12, fontWeight:400, color:"#9ca3af"}}, ` ${upcomingTasks.length}`)
            ),
            upcomingTasks.length === 0
              ? h("div", {style:{padding:12, color:"#9ca3af", fontSize:12, textAlign:"center"}}, "\u65E0\u5373\u5C06\u5230\u671F\u4EFB\u52A1")
              : upcomingTasks.slice(0,8).map((t,i) => {
                  const proj = PROJECTS.find(p=>p.id===t.projectId);
                  const daysLeft = Math.round((parseDate(t.end) - todayD) / 864e5);
                  return h("div", {key:t.id, className:"dash-alert-item", onClick:()=>goToTask(t)},
                    h("span", {style:{width:8, height:8, borderRadius:"50%", background:proj?proj.color:"#999", flexShrink:0}}),
                    h("span", {style:{flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}, t.name),
                    h("span", {style:{color:daysLeft===0?"#ef4444":"#f59e0b", fontWeight:600, whiteSpace:"nowrap", fontSize:11}}, daysLeft===0?"\u4ECA\u5929":`${daysLeft}\u5929`)
                  );
                })
          ),
          // Recently completed
          h("div", {className:"dashboard-section", style:{flex:1, minWidth:0, marginBottom:0}},
            h("div", {className:"dashboard-section-title"},
              h("span", {style:{color:"#10b981"}}, "\u2714 \u8FD1\u671F\u5B8C\u6210"),
              h("span", {style:{fontSize:12, fontWeight:400, color:"#9ca3af"}}, ` ${recentDone.length}`)
            ),
            recentDone.length === 0
              ? h("div", {style:{padding:12, color:"#9ca3af", fontSize:12, textAlign:"center"}}, "\u8FD17\u5929\u65E0\u5B8C\u6210\u4EFB\u52A1")
              : recentDone.slice(0,8).map((t,i) => {
                  const proj = PROJECTS.find(p=>p.id===t.projectId);
                  return h("div", {key:t.id, className:"dash-alert-item", onClick:()=>goToTask(t)},
                    h("span", {style:{width:8, height:8, borderRadius:"50%", background:proj?proj.color:"#999", flexShrink:0}}),
                    h("span", {style:{flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}, t.name),
                    h("span", {style:{color:"#10b981", fontSize:11, whiteSpace:"nowrap"}}, fmtShort(t.end))
                  );
                })
          )
        ),

        // ── Row 4: Stats (left) + Phase Progress (right) ──
        h("div", {style:{display:"flex", gap:16, marginBottom:16}},
          h("div", {style:{flex:"0 0 280px"}},
            h("div", {style:{display:"flex", gap:12, flexWrap:"wrap"}},
              h("div", {style:{background:"#fff", borderRadius:8, padding:"10px 16px", border:"1px solid #e5e7eb"}},
                h("div", {style:{fontSize:11, color:"#6b7280"}}, "\u603B\u4EFB\u52A1"),
                h("div", {style:{fontSize:18, fontWeight:700}}, allTasks.length)
              ),
              h("div", {style:{background:"#fff", borderRadius:8, padding:"10px 16px", border:"1px solid #e5e7eb"}},
                h("div", {style:{fontSize:11, color:"#6b7280"}}, "\u603B\u5DE5\u65F6"),
                h("div", {style:{fontSize:18, fontWeight:700}}, fmtHours(totalHrs))
              ),
              h("div", {style:{background:"#fff", borderRadius:8, padding:"10px 16px", border:"1px solid #e5e7eb"}},
                h("div", {style:{fontSize:11, color:"#6b7280"}}, "\u6210\u5458"),
                h("div", {style:{fontSize:18, fontWeight:700}}, allMembers.size)
              )
            )
          ),
          h("div", {className:"dashboard-section", style:{flex:1, minWidth:0, marginBottom:0}},
            h("div", {className:"dashboard-section-title"},
              h("span", null, "\u9636\u6BB5\u8FDB\u5EA6"),
              selProj && h("span", {style:{fontSize:12, fontWeight:400, color:"#9ca3af", marginLeft:8}}, selProj.name)
            ),
            selPhases.length === 0
              ? h("div", {style:{padding:12, color:"#9ca3af", fontSize:12, textAlign:"center"}}, "\u6682\u65E0\u9636\u6BB5")
              : selPhases.map((ph,i) => {
                  const tasks = TASKS.filter(t => t.phaseId === ph.id);
                  const done = tasks.filter(t => t.done).length;
                  const total = tasks.length;
                  const prog = total ? Math.round(done/total*100) : 0;
                  return h("div", {key:ph.id, className:"dash-phase-item"},
                    h("div", {style:{position:"relative", width:40, height:40, flexShrink:0}},
                      h("svg", {width:40, height:40, viewBox:"0 0 40 40"},
                        h("circle", {cx:20, cy:20, r:16, fill:"none", stroke:"#e5e7eb", strokeWidth:4}),
                        h("circle", {cx:20, cy:20, r:16, fill:"none", stroke:ph.color, strokeWidth:4,
                          strokeDasharray:`${prog*1.005} ${100.5-prog*1.005}`,
                          strokeLinecap:"round", transform:"rotate(-90 20 20)"})
                      ),
                      h("span", {style:{position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", fontSize:10, fontWeight:700, color:"#374151"}}, `${prog}%`)
                    ),
                    h("div", {style:{flex:1}},
                      h("div", {style:{fontSize:12, fontWeight:600, color:"#374151", marginBottom:2}}, ph.name),
                      h("div", {style:{fontSize:11, color:"#9ca3af"}}, `${done}/${total} \u4EFB\u52A1`)
                    )
                  );
                })
          )
        ),

        // ── Row 5: Project Review Results ──
        h("div", {ref:reviewRef, className:"dashboard-section"},
          h("div", {className:"dashboard-section-title"}, "\u9879\u76EE\u590D\u76D8\u7ED3\u679C"),
          PROJECTS.map(p => {
            const review = PROJECT_REVIEWS.find(r => r.projectId === p.id);
            const isEditing = editingReviewId === p.id;
            return h("div", {key:p.id, style:{marginBottom:12, paddingBottom:12, borderBottom:"1px solid #f0f0f0"}},
              h("div", {style:{display:"flex", alignItems:"center", gap:8, marginBottom:6}},
                h("span", {style:{width:8, height:8, borderRadius:"50%", background:p.color, flexShrink:0}}),
                h("span", {style:{fontSize:13, fontWeight:600}}, p.name),
                h("button", {
                  style:{marginLeft:"auto", padding:"2px 10px", borderRadius:4, border:"1px solid #d1d5db", background:"#fff", fontSize:11, cursor:"pointer"},
                  onClick: () => {
                    if (isEditing) {
                      setEditingReviewId(null);
                    } else {
                      setEditingReviewId(p.id);
                      setEditingReviewText(review ? review.content : "");
                    }
                  }
                }, isEditing ? "\u5B8C\u6210" : "\u7F16\u8F91")
              ),
              isEditing
                ? h("textarea", {
                    value: editingReviewText,
                    onChange: e => setEditingReviewText(e.target.value),
                    onBlur: () => {
                      const idx = PROJECT_REVIEWS.findIndex(r => r.projectId === p.id);
                      if (editingReviewText.trim()) {
                        if (idx !== -1) PROJECT_REVIEWS[idx].content = editingReviewText.trim();
                        else PROJECT_REVIEWS.push({projectId: p.id, content: editingReviewText.trim()});
                      } else if (idx !== -1) {
                        PROJECT_REVIEWS.splice(idx, 1);
                      }
                      setEditingReviewId(null);
                      autoSave();
                    },
                    onKeyDown: e => { if (e.key === "Escape") { setEditingReviewId(null); } if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.target.blur(); } },
                    autoFocus: true,
                    rows: 3,
                    style: {width:"100%", padding:"6px 8px", border:"1px solid #d1d5db", borderRadius:4, fontSize:12, fontFamily:"inherit", resize:"vertical", outline:"none"}
                  })
                : h("div", {style:{fontSize:12, color: review ? "#374151" : "#9ca3af", lineHeight:1.6, whiteSpace:"pre-wrap", minHeight:20, cursor:"text"}, onClick: () => { setEditingReviewId(p.id); setEditingReviewText(review ? review.content : ""); }},
                    review ? review.content : "\u70B9\u51FB\u6DFB\u52A0\u590D\u76D8\u5185\u5BB9...")
            );
          })
        )
      );
    }

    // Single project heatmap with its own date controls
    function ProjectHeatmap({ project }) {
      const dl=["周一","周二","周三","周四","周五","周六","周日"];
      const pinkColors = ["#f3f0f4","#f5d0e8","#e8a0d0","#d470b8","#c040a0","#a82088"];

      const autoStart = useMemo(() => {
        const pTasks = TASKS.filter(t=>t.projectId===project.id);
        if (pTasks.length === 0) return new Date().toISOString().slice(0,10);
        const minDate = pTasks.reduce((min, t) => t.start < min ? t.start : min, pTasks[0].start);
        const d = new Date(minDate);
        const day = d.getDay();
        const diff = day === 0 ? 6 : day - 1;
        d.setDate(d.getDate() - diff);
        return d.toISOString().slice(0,10);
      }, [project.id]);

      const [startDate, setStartDate] = useState(autoStart);
      const [weekCount, setWeekCount] = useState(13);
      const [tooltip, setTooltip] = useState(null);

      const getDayTasks = (dateStr) => {
        const td = parseDate(dateStr);
        return TASKS.filter(t => {
          if (t.projectId !== project.id) return false;
          const ts = parseDate(t.start), te = parseDate(t.end);
          return td >= ts && td <= te;
        });
      };

      const monthLabels = useMemo(() => {
        const labels = [];
        const d = new Date(startDate);
        let lastMonth = -1;
        for (let w = 0; w < weekCount; w++) {
          const ws = new Date(d);
          ws.setDate(ws.getDate() + w * 7);
          const mk = ws.getFullYear() * 12 + ws.getMonth();
          if (mk !== lastMonth) {
            labels.push({ week: w, label: `${ws.getFullYear()}/${String(ws.getMonth()+1).padStart(2,'0')}` });
            lastMonth = mk;
          }
        }
        return labels;
      }, [startDate, weekCount]);

      const getCellBg = (count) => {
        if (count === 0) return pinkColors[0];
        const idx = Math.min(count, pinkColors.length - 1);
        return pinkColors[idx];
      };

      const grid = useMemo(() => {
        const g = [];
        for (let w = 0; w < weekCount; w++) {
          const ws = addDays(startDate, w * 7);
          const week = [];
          for (let d = 0; d < 7; d++) {
            const dt = addDays(ws, d);
            const tasks = getDayTasks(dt);
            week.push({ date: dt, count: tasks.length, tasks });
          }
          g.push(week);
        }
        return g;
      }, [startDate, weekCount, project.id]);

      const taskCount = TASKS.filter(t=>t.projectId===project.id).length;

      return h("div", {style:{background:"#fff",borderRadius:12,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",minWidth:380,flex:"1 1 380px",maxWidth:"100%"}},
        // Header
        h("div", {style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          h("div", {style:{width:12,height:12,borderRadius:3,background:project.color}}),
          h("span", {style:{fontSize:14,fontWeight:600,color:"#374151"}}, project.name),
          h("span", {style:{fontSize:11,color:"#9ca3af"}}, `(${taskCount} 条任务)`)
        ),
        // Date controls
        h("div", {style:{display:"flex",gap:12,alignItems:"center",marginBottom:10,flexWrap:"wrap"}},
          h("div", {style:{display:"flex",alignItems:"center",gap:6}},
            h("label", {style:{fontSize:12,color:"#6b7280"}}, "开始"),
            h("input", {type:"date", value:startDate, onChange:e=>setStartDate(e.target.value), style:{padding:"3px 6px",border:"1px solid #d1d5db",borderRadius:4,fontSize:12,outline:"none"}})
          ),
          h("div", {style:{display:"flex",alignItems:"center",gap:6}},
            h("label", {style:{fontSize:12,color:"#6b7280"}}, "周数"),
            h("select", {value:weekCount, onChange:e=>setWeekCount(parseInt(e.target.value)), style:{padding:"3px 6px",border:"1px solid #d1d5db",borderRadius:4,fontSize:12,outline:"none"}},
              [4,8,13,26,52].map(n => h("option", {key:n, value:n}, n + "周"))
            )
          )
        ),
        // Heatmap grid
        h("div", {style:{display:"flex",gap:24}},
          h("div", {className:"workload-labels"}, ...dl.map(d=>h("div", {key:d, className:"workload-label"}, d))),
          h("div", {style:{flex:1,minWidth:0}},
            h("div", {className:"workload-grid"},
              ...grid.map((wk,wi)=>h("div", {key:wi, className:"workload-month-row", style:{flexDirection:"column",gap:4}},
                ...wk.map((cell,di)=>
                  h("div", {key:di, className:"workload-cell",
                    style:{background:getCellBg(cell.count), cursor: cell.count > 0 ? "pointer" : "default"},
                    onMouseEnter:e=>{
                      if(cell.count===0) return;
                      const r=e.target.getBoundingClientRect();
                      setTooltip({x:r.right+8, y:r.top, date:cell.date, count:cell.count, tasks:cell.tasks});
                    },
                    onMouseLeave:()=>setTooltip(null)
                  })
                )
              )),
            ),
            h("div", {style:{display:"flex",gap:4,marginTop:4}},
              ...monthLabels.map((ml, i) => h("div", {key:i, className:"workload-month-label", style:{width:80, marginLeft: ml.week === 0 ? 0 : (ml.week - (monthLabels[i-1]?.week || 0)) * 20 - 80}}, ml.label))
            )
          )
        ),
        // Tooltip
        tooltip && h("div", {className:"tooltip-box", style:{position:"fixed",left:tooltip.x,top:tooltip.y, minWidth:160, whiteSpace:"normal", maxHeight:200, overflowY:"auto",zIndex:9999}},
          h("div", {style:{fontWeight:600,marginBottom:4,fontSize:12}}, `${tooltip.date} - ${tooltip.count} 条任务`),
          tooltip.tasks.map((t,i) => h("div", {key:i, style:{fontSize:11,padding:"1px 0"}}, t.name))
        )
      );
    }

    function WorkloadView() {
      const projectsWithTasks = PROJECTS.filter(p => TASKS.some(t => t.projectId === p.id));

      return h("div", {className:"workload-container"},
        h("div", {className:"dashboard-section"},
          h("div", {className:"dashboard-section-title"}, "Workload Analysis"),
          projectsWithTasks.length === 0
            ? h("div", {style:{color:"#9ca3af",fontSize:13,padding:20,textAlign:"center"}}, "暂无任务数据")
            : h("div", {style:{display:"flex",flexWrap:"wrap",gap:16}},
                ...projectsWithTasks.map(p => h(ProjectHeatmap, {key:p.id, project:p}))
              )
        )
      );
    }

    function TabBar() {
      const [tabs, setTabs] = useState(openTabs);
      const [activeId, setActiveId] = useState(activeTabId);
      
      useEffect(() => {
        onTabChange(() => {
          setTabs([...openTabs]);
          setActiveId(activeTabId);
        });
      }, []);
      
      return h("div", {className:"file-tabs-bar"},
        ...tabs.map(tab => 
          h("div", {
            key: tab.id,
            className: `file-tab ${tab.id === activeId ? 'active' : ''}`,
            onClick: () => switchTab(tab.id)
          },
            h("span", {className: tab.dirty ? "tab-dirty" : "tab-saved"}),
            h("span", {className:"tab-name"}, tab.name),
            h("button", {
              className:"tab-close",
              onClick: (e) => { e.stopPropagation(); closeTab(tab.id); },
              title:"关闭"
            }, "×")
          )
        )
      );
    }

    function App() {
      const [view, setView] = useState("gantt");
      const [selectedProject, setSelectedProject] = useState(1);
      const [appRenderKey, setAppRenderKey] = useState(0);
      const triggerAppRender = () => setAppRenderKey(k => k + 1);
      useEffect(() => { onGlobalRender(triggerAppRender); }, []);
      useEffect(() => {
        const handler = (e) => { if((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); saveData(); } };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, []);

      const handleRenameProject = (projId, newName) => {
        const p = PROJECTS.find(x => x.id === projId);
        if(p) { p.name = newName; autoSave(); triggerAppRender(); }
      };
      const handleDeleteProject = (projId) => {
        const idx = PROJECTS.findIndex(p => p.id === projId);
        if(idx === -1 || PROJECTS.length <= 1) return;
        PROJECTS.splice(idx, 1);
        // Remove associated tasks and phases
        for(let i = TASKS.length - 1; i >= 0; i--) { if(TASKS[i].projectId === projId) TASKS.splice(i, 1); }
        for(let i = PHASES.length - 1; i >= 0; i--) { if(PHASES[i].projectId === projId) PHASES.splice(i, 1); }
        autoSave();
        if(selectedProject === projId) { setSelectedProject(PROJECTS[0].id); }
        triggerAppRender();
      };
      const handleBatchDeleteProjects = (projIds) => {
        // Keep at least one project
        const toDelete = projIds.filter(id => PROJECTS.length - projIds.filter(d=>d===id).length >= 1 || PROJECTS.length > projIds.length);
        if(PROJECTS.length - toDelete.length < 1) {
          // Can't delete all projects, keep the first one
          toDelete.splice(toDelete.indexOf(PROJECTS[0].id), 1);
        }
        for(const projId of toDelete) {
          const idx = PROJECTS.findIndex(p => p.id === projId);
          if(idx !== -1) PROJECTS.splice(idx, 1);
          for(let i = TASKS.length - 1; i >= 0; i--) { if(TASKS[i].projectId === projId) TASKS.splice(i, 1); }
          for(let i = PHASES.length - 1; i >= 0; i--) { if(PHASES[i].projectId === projId) PHASES.splice(i, 1); }
        }
        autoSave();
        if(toDelete.includes(selectedProject)) { setSelectedProject(PROJECTS[0]?.id || 1); }
        triggerAppRender();
      };

      return h("div", {className:"app", key:appRenderKey},
        h(TopBar, {view, setView, selectedProject, onSelectProject:setSelectedProject, onRenameProject:handleRenameProject, onDeleteProject:handleDeleteProject, onBatchDeleteProjects:handleBatchDeleteProjects}),
        h(TabBar, null),
        h("div", {style:{display:"flex", flex:1, minHeight:0, overflow:"hidden"}},
          view==="gantt" && h(GanttView, {selectedProject}),
          view==="calendar" && h(CalendarView, {selectedProject}),
          view==="dashboard" && h(DashboardView, {selectedProject, setView, setSelectedProject}),
          view==="workload" && h(WorkloadView, null)
        )
      );
    }

    // ─── Mount ──────────────────────────────────────────────────────────────────
    (async () => {
      try {
        await loadData();
        const root = document.getElementById("root");
        root.textContent = "";
        createRoot(root).render(h(App));
        window.__ganttable_ok = true;
      } catch(e) {
        document.getElementById("root").textContent = "Error: " + e.message;
        window.__ganttable_err = e.message;
      }
    })();
  </script>
</body>
</html>
